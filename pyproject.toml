[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading_bot"
version = "0.1.0"
description = "A trading bot for algorithmic trading"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.13.1",
    "flask==2.2.5",
    "flask-socketio==5.3.6",
    "python-dotenv==0.19.0",
    "pandas==1.5.3",
    "numpy==1.24.3",
    "aiohttp==3.8.1",
    "requests==2.31.0",
    "websockets==10.4",
    "pytz==2023.3",
    "python-dateutil==2.8.2",
    "Authlib==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.3.0",
    "flake8==6.1.0",
    "mypy==1.5.1",
    "safety==1.10.3",
    "bandit==1.7.5",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src --cov-report=xml" 