[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist,*.egg-info,venv,venv310
ignore = W293,W291,W292,E302,E305,W503
per-file-ignores =
    __init__.py: F401
    src/core/bot.py: F401
    src/core/strategy.py: F401,E501
    src/core/portfolio.py: F401,E501
    src/core/risk_manager.py: F401
    src/core/data_feed.py: F401
    src/utils/alpaca_client.py: F401
    src/utils/config.py: F401
    src/utils/logger.py: F401,E501
    src/main.py: F401
    src/mock_bot.py: F401
    src/run_mocked_bot.py: F401,E402
    src/strategies/moving_average.py: F401
    src/backtest.py: F401
    src/backtesting/engine.py: F401
    src/data_handler.py: F401,E501
    src/web_server.py: F401
    src/core/alpaca_types.py: E501,E704,F811
    src/logger.py: E501
