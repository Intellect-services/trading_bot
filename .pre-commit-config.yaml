# Pre-commit hooks configuration
# Install with: pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.8
    hooks:
      - id: ruff
        args:
          - --fix
          - --exit-non-zero-on-fix
          - --ignore=UP038
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-urllib3
        args:
          - --config-file=pyproject.toml
          - --ignore-missing-imports
          - src/app.py
          - src/models
          - src/services
          - scripts/verify_implementation.py
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, src/, -f, json, -c, pyproject.toml]
        pass_filenames: false
        additional_dependencies: [pbr]

  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args:
          - --convention=google
          - --add-ignore=D100,D101,D102,D103,D104,D105,D107,D200,D205,D212,D415
        exclude: ^(tests/|alembic/|migrations/|src/core/|src/ml/|src/indicators/|src/strategies/|src/backtesting/|src/business/|src/api/|src/infrastructure/|create_migration_tables\.py)
