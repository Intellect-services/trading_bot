# Ruff configuration file
# Ruff is a fast Python linter and formatter that replaces flake8, black, and isort

target-version = "py310"
line-length = 100

[lint]
# Enable all rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
    "B904",  # Allow `raise` without specifying exception
    "C901",  # Too complex (we'll handle this separately)
    "W191",  # Indentation contains tabs
    "E402",  # Module level import not at top of file (sometimes needed)
    "PT009",  # Use regular assert instead of unittest-style (test files)
    "PT011",  # pytest.raises too broad (test files)
    "B017",  # Do not assert blind exception (test files)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude common directories
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "venv",
    "venv310",
    ".venv",
    "node_modules",
    "alembic/versions",
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["ARG", "S101"]  # Allow unused arguments and assert in tests

[lint.isort]
known-first-party = ["src"]

[lint.mccabe]
max-complexity = 10

[format]
# Use double quotes for strings
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Skip magic trailing comma
skip-magic-trailing-comma = false
# Line ending style
line-ending = "auto"
