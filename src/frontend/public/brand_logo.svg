<svg width="260" height="80" viewBox="0 0 260 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" /> <!-- Violet -->
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" /> <!-- Light Green -->
    </linearGradient>
  </defs>

  <!-- Icon Container -->
  <g transform="translate(10, 15)">
    <!-- Circle Background -->
    <circle cx="25" cy="25" r="25" fill="url(#circleGradient)" />

    <!-- Dollar Sign ($) - White, Centered -->
    <text x="25" y="34"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="32"
          font-weight="700"
          fill="#FFFFFF"
          text-anchor="middle">
      $
    </text>
  </g>

  <!-- Text: IntellectScout -->
  <text x="70" y="38"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#FFFFFF"
        letter-spacing="-0.5">
    IntellectScout
  </text>

  <!-- Tagline: Trade Smarter -->
  <text x="70" y="58"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="13"
        font-weight="600"
        fill="#34D399"
        letter-spacing="1.5"
        style="text-transform: uppercase;">
    TRADE SMARTER
  </text>
</svg>
