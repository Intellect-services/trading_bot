<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Bot - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-blue: #1a73e8;
        --secondary-blue: #4285f4;
        --dark-blue: #0d47a1;
        --light-blue: #e8f0fe;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        background: linear-gradient(135deg, #0d47a1 0%, #1a73e8 100%);
      }

      .login-header {
        text-align: center;
        padding: 1.25rem;
        color: white;
        font-size: 1.5rem;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        flex-shrink: 0;
        height: 4rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-header i {
        margin-right: 0.5rem;
        color: var(--light-blue);
      }

      .login-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        overflow: hidden;
        min-height: 0;
      }

      .login-box {
        max-width: 400px;
        width: 100%;
        padding: 2rem;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 8rem);
      }

      .login-title {
        text-align: center;
        margin-bottom: 1.25rem;
      }

      .login-title h1 {
        color: var(--primary-blue);
        font-weight: 600;
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }

      .login-title p {
        color: #666;
        font-size: 0.9rem;
        margin: 0;
      }

      .form-control {
        border-radius: 8px;
        padding: 0.75rem 1rem;
        border: 2px solid #e0e0e0;
      }

      .form-control:focus {
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 0.2rem rgba(26, 115, 232, 0.25);
      }

      .btn-primary {
        background-color: var(--primary-blue);
        border: none;
        border-radius: 8px;
        padding: 0.75rem;
        font-weight: 500;
        width: 100%;
      }

      .btn-primary:hover {
        background-color: var(--dark-blue);
      }

      .social-login {
        margin-top: 1.25rem;
      }

      .social-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 0.75rem;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
        background: white;
        color: #333;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      .social-btn:hover {
        background: #f8f9fa;
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .social-btn.google {
        color: #4285f4;
      }

      .social-btn.github {
        color: #333;
      }

      .social-btn.linkedin {
        color: #0077b5;
      }

      .social-btn i {
        font-size: 1.1rem;
      }

      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 1rem 0;
        color: #666;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #e0e0e0;
      }

      .divider span {
        padding: 0 1rem;
      }

      .error-message {
        color: #dc3545;
        font-size: 0.875rem;
        margin-top: 0.5rem;
      }

      .login-footer {
        text-align: center;
        padding: 1.25rem;
        color: white;
        font-size: 0.875rem;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        flex-shrink: 0;
        height: 4rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @media (max-height: 700px) {
        .login-header,
        .login-footer {
          height: 3.5rem;
          padding: 1rem;
        }

        .login-container {
          padding: 0.75rem;
        }

        .login-box {
          padding: 1.5rem;
          max-height: calc(100vh - 7rem);
        }

        .login-title {
          margin-bottom: 1rem;
        }

        .social-login {
          margin-top: 1rem;
        }

        .divider {
          margin: 0.75rem 0;
        }

        .social-btn {
          margin-bottom: 0.5rem;
          padding: 0.5rem;
        }

        .form-control {
          padding: 0.5rem 0.75rem;
        }
      }

      @media (max-width: 480px) {
        .login-header,
        .login-footer {
          height: 3.5rem;
          padding: 1rem;
        }

        .login-box {
          padding: 1.5rem;
          max-height: calc(100vh - 7rem);
        }

        .login-title h1 {
          font-size: 1.25rem;
        }

        .form-control {
          padding: 0.5rem 0.75rem;
        }

        .btn-primary,
        .social-btn {
          padding: 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="login-header">
      <i class="fas fa-chart-line"></i> Trading Bot
    </header>

    <div class="login-container">
      <div class="login-box">
        <div class="login-title">
          <h1>Welcome Back</h1>
          <p>Sign in to access your trading dashboard</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              required
            />
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="remember" />
            <label class="form-check-label" for="remember">Remember me</label>
          </div>

          <button type="submit" class="btn btn-primary">Sign In</button>

          {% if error %}
          <div class="error-message">{{ error }}</div>
          {% endif %}
        </form>

        <div class="divider">
          <span>OR</span>
        </div>

        <div class="social-login">
          <button class="social-btn google">
            <i class="fab fa-google"></i>
            Continue with Google
          </button>
          <button class="social-btn github">
            <i class="fab fa-github"></i>
            Continue with GitHub
          </button>
          <button class="social-btn linkedin">
            <i class="fab fa-linkedin"></i>
            Continue with LinkedIn
          </button>
        </div>

        <div class="text-center mt-3">
          <a href="#" class="text-decoration-none">Forgot password?</a>
        </div>
      </div>
    </div>

    <footer class="login-footer">© 2024 Trading Bot</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
